name: Bug report
description: "Something in the app doesn't work: it crashes, freezes, looks broken or does the wrong thing."
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. If you came from **Report** in the app, it copied the error details, build and device: paste them below.
        If the app disagrees with the wiki about a character or rule, use **Rules or character error** instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Script, player count, characters involved, and what you tapped.
      placeholder: |
        1. Load Trouble Brewing with 8 players
        2. Tap a seat, then ...
  - type: dropdown
    id: role
    attributes:
      label: Were you using it as
      options:
        - Storyteller
        - Player
        - Both / not sure
  - type: dropdown
    id: device-type
    attributes:
      label: Device
      options:
        - Phone
        - Tablet
        - Desktop or laptop
  - type: input
    id: device
    attributes:
      label: Browser and device details
      description: e.g. "Safari on iPhone 13, iOS 19" (the app copies this when you tap Report).
  - type: input
    id: page
    attributes:
      label: Page
      description: The page you were on, e.g. /settings.
  - type: input
    id: build
    attributes:
      label: Build
      description: Shown at the bottom of every page (version · commit · branch · channel · built at).
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Error details
      description: Paste what the app copied when you tapped Report (on a problem or on Diagnostics). It holds the error and where it happened, never your game.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else
      description: Drag images in here. Please hide anything that would spoil a live game.
