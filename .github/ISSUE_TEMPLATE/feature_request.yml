name: Feature request
description: An idea or improvement for Grim-Games.
title: '[Idea] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation at the table and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. Sketches and screenshots welcome.
  - type: dropdown
    id: role
    attributes:
      label: Who is it for?
      options:
        - Storyteller
        - Players
        - Both
  - type: input
    id: characters
    attributes:
      label: Characters or rules involved
      description: Character names, jinxes or wiki pages, if any.
