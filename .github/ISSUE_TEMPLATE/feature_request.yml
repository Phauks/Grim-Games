name: Enhancement request
description: Something new, or a better way for something to work.
title: '[Enhancement] '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation at the table and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you'd like it to work. Sketches and screenshots welcome.
  - type: dropdown
    id: role
    attributes:
      label: Who is it for?
      options:
        - Storyteller
        - Players
        - Both
  - type: input
    id: characters
    attributes:
      label: Characters or rules involved
      description: Character names, jinxes or wiki pages, if any.
  - type: input
    id: build
    attributes:
      label: Build
      description: Shown at the bottom of every page, if you know it.
