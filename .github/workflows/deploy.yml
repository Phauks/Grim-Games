# Deploys to Trevor's Cloudflare account (05-spike-results.md S1-S2).
# main -> `grim-games` (production); pull requests -> `grim-games-staging` (shared).
# Needs repository secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID; until they
# exist the deploy step is skipped rather than failing.
name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.event_name == 'push' && 'production' || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Fork PRs never get secrets; the repo is private, so this only guards the odd case.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'staging' }}
      url: ${{ steps.deploy.outputs.deployment-url }}
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - name: Report missing Cloudflare secrets
        if: env.HAS_CLOUDFLARE_TOKEN != 'true'
        run: echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping deploy."
      - uses: actions/checkout@v6
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
      - uses: actions/setup-node@v6
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
      - run: npm run build
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
      - name: Deploy Worker
        id: deploy
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.151.0'
          command: ${{ github.event_name == 'push' && 'deploy' || 'deploy --env staging' }}
