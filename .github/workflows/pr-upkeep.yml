# Flags open PRs into beta that can't land on their own, with one comment per PR head, so the
# Claude thread watching the PR wakes up and fixes it (Trevor, 2026-10-26: "Be better for merge
# conflicts on these open PRs").
#
# Two ways a PR stalls silently:
# - It conflicts with beta. GitHub then runs no Actions on it, so no CI result ever comes back,
#   auto-merge never fires and nothing wakes the owning thread (Oct 25 and Oct 26 sweeps found
#   every open PR stuck this way).
# - It is green and mergeable, but auto-merge is off or never fired (#648, Oct 26).
#
# It only comments and labels: a push or merge made with GITHUB_TOKEN would start no CI.
name: PR upkeep

on:
  push:
    branches: [beta]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-upkeep
  cancel-in-progress: true

jobs:
  flag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const LABEL = 'merge conflict';
            // A green PR left unmerged this long counts as stuck.
            const STUCK_MINUTES = 30;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            // Right after a push to beta, GitHub still reports each PR's mergeability against
            // the old beta (#654 read as mergeable seconds after #653 made it conflict), so give
            // it time to recompute.
            if (context.eventName === 'push') await sleep(90000);

            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'beta', per_page: 100
            });
            core.info(`${prs.length} open PRs into beta`);

            // GitHub works out mergeability lazily: the first read starts it, later reads see it.
            async function read(number) {
              for (let attempt = 0; attempt < 6; attempt++) {
                const { data } = await github.rest.pulls.get({ owner, repo, pull_number: number });
                if (data.mergeable !== null && data.mergeable_state !== 'unknown') return data;
                await sleep(5000);
              }
              return undefined;
            }

            async function commentOnce(pr, kind, body) {
              const marker = `<!-- pr-upkeep:${kind}:${pr.head.sha} -->`;
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100
              });
              if (comments.some((c) => c.body?.includes(marker))) return;
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number, body: `${marker}\n${body}`
              });
              core.info(`#${pr.number}: commented (${kind})`);
            }

            async function setLabel(pr, on) {
              const has = pr.labels.some((l) => l.name === LABEL);
              if (on && !has) {
                await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [LABEL] });
              } else if (!on && has) {
                await github.rest.issues.removeLabel({ owner, repo, issue_number: pr.number, name: LABEL });
              }
            }

            for (const listed of prs) {
              if (listed.draft) continue;
              const pr = await read(listed.number);
              if (!pr) {
                core.info(`#${listed.number}: mergeability still unknown, next run`);
                continue;
              }
              core.info(`#${pr.number}: mergeable=${pr.mergeable} state=${pr.mergeable_state}`);

              if (pr.mergeable === false || pr.mergeable_state === 'dirty') {
                await setLabel(pr, true);
                await commentOnce(
                  pr,
                  'conflict',
                  'This PR conflicts with `beta`, so GitHub runs no CI on it and auto-merge cannot land it. ' +
                    'Merge `beta` into this branch (a merge commit, no rebase), resolve the conflicts, run ' +
                    '`npm run verify` and push.'
                );
                continue;
              }
              await setLabel(pr, false);

              // clean: every check passed. unstable: the required ones passed and only an optional
              // one (such as "Workers Builds") did not.
              const mergeable = pr.mergeable_state === 'clean' || pr.mergeable_state === 'unstable';
              const idleMinutes = (Date.now() - Date.parse(pr.updated_at)) / 60000;
              if (mergeable && !pr.auto_merge) {
                await commentOnce(
                  pr,
                  'no-auto-merge',
                  'This PR is green and mergeable but auto-merge is off, so it will not land. Turn on auto-merge (merge commit).'
                );
              } else if (mergeable && idleMinutes > STUCK_MINUTES) {
                await commentOnce(
                  pr,
                  'stuck',
                  `This PR has been green and mergeable for over ${STUCK_MINUTES} minutes with auto-merge on, ` +
                    'but it has not merged. Merge it through the merge API (merge commit).'
                );
              }
            }
