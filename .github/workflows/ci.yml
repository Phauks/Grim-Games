name: CI

on:
  pull_request:
  push:
    branches: [main, beta]

# A newer push cancels a PR's stale run. On beta and main a run is never cancelled once it has
# started, so every push that lands gets a verdict; pushes that arrive meanwhile wait, and
# only the newest waiting one runs (on 2026-10-18, 86% of beta runs were cancelled mid-way
# and a broken beta went unnoticed for hours).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A stalled cache download gives up after 2 minutes instead of the default 10, and the job
  # carries on without the npm cache (on 2026-10-23 setup-node sat 10 minutes on every job).
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    # Playwright's own image has Chromium and its system libraries installed, so no job spends
    # time on `playwright install --with-deps` (which took 10 minutes on about one run in ten).
    # The tag must match the installed @playwright/test; scripts/scripts.test.ts checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # The container runs as root over a checkout owned by the runner user, so git refuses
      # the repo without safe.directory and the changelog and update notes come out empty.
      # DejaVu is the runner's monospace font; the image lacks it, and its fallback monospace
      # has narrower letters that change wrapping in the layout tests.
      - name: Prepare container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-dejavu-core
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run build

  e2e:
    name: Touch e2e (phone + tablet, shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # Playwright's own image has Chromium and its system libraries installed, so no job spends
    # time on `playwright install --with-deps` (which took 10 minutes on about one run in ten).
    # The tag must match the installed @playwright/test; scripts/scripts.test.ts checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    # Each shard runs a sixth of the tests (fullyParallel spreads single tests, not files). With
    # three shards, a shard took 25 to 32 minutes on 2026-10-27 and runners never queued, so six
    # halve the wait. Branch rules require "E2E done", not the shards, so the count can change.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v6
      # The container runs as root over a checkout owned by the runner user, so git refuses
      # the repo without safe.directory and the changelog and update notes come out empty.
      # DejaVu is the runner's monospace font; the image lacks it, and its fallback monospace
      # has narrower letters that change wrapping in the layout tests.
      - name: Prepare container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-dejavu-core
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/6
      - name: List flaky tests
        id: flaky
        if: always()
        run: node scripts/flaky-summary.ts --run
      # A flaky test passes on its retry, so the job is green; the report still holds the failed
      # attempt's trace, which is the only way to see why it flaked.
      - if: failure() || fromJSON(steps.flaky.outputs.flaky || '0') > 0
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # The one e2e check the branch rules require, so adding or removing shards needs no ruleset
  # change. It fails unless every shard passed (a skipped or cancelled shard fails it too).
  e2e-done:
    name: E2E done
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.e2e.result != 'success'
        run: |
          echo "E2E shards finished with: ${{ needs.e2e.result }}"
          exit 1
      - run: echo "Every e2e shard passed."
