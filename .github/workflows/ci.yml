name: CI

on:
  pull_request:
  push:
    branches: [main, beta]

# A newer push cancels a PR's stale run. On beta and main a run is never cancelled once it has
# started, so every push that lands gets a verdict; pushes that arrive meanwhile wait, and
# only the newest waiting one runs (on 2026-10-18, 86% of beta runs were cancelled mid-way
# and a broken beta went unnoticed for hours).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for browser component tests
        run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run build

  e2e:
    name: Touch e2e (phone + tablet, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Each shard runs a third of the tests (fullyParallel spreads single tests, not files);
    # the whole suite is about 23 minutes on one runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/3
      - name: List flaky tests
        if: always()
        run: node scripts/flaky-summary.ts --run
      - if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7
