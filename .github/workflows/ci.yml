name: CI

on:
  pull_request:
  push:
    branches: [main, beta]

# A newer push cancels a PR's stale run. On beta and main a run is never cancelled once it has
# started, so every push that lands gets a verdict; pushes that arrive meanwhile wait, and
# only the newest waiting one runs (on 2026-10-18, 86% of beta runs were cancelled mid-way
# and a broken beta went unnoticed for hours).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A stalled cache download gives up after 2 minutes instead of the default 10, and the job
  # carries on without the npm cache (on 2026-10-23 setup-node sat 10 minutes on every job).
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

jobs:
  verify:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    # Playwright's own image has Chromium and its system libraries installed, so no job spends
    # time on `playwright install --with-deps` (which took 10 minutes on about one run in ten).
    # The tag must match the installed @playwright/test; scripts/scripts.test.ts checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # The runner's own DejaVu, read-only, so the font needs no download (see Prepare container).
      options: --ipc=host -v /usr/share/fonts/truetype/dejavu:/opt/runner-dejavu:ro
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # The container runs as root over a checkout owned by the runner user, so git refuses
      # the repo without safe.directory and the changelog and update notes come out empty.
      # DejaVu is the runner's monospace font; the image lacks it, and its fallback monospace
      # has narrower letters that change wrapping in the layout tests. The core set (what
      # fonts-dejavu-core installs) is copied from the runner, because the Ubuntu mirrors stopped
      # resolving from the container for over an hour on 2026-11-11; apt is the fallback.
      - name: Prepare container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          core="DejaVuSans DejaVuSans-Bold DejaVuSansMono DejaVuSansMono-Bold DejaVuSerif DejaVuSerif-Bold"
          have=yes
          for f in $core; do [ -f "/opt/runner-dejavu/$f.ttf" ] || have=no; done
          if [ "$have" = yes ]; then
            mkdir -p /usr/share/fonts/truetype/dejavu
            for f in $core; do cp "/opt/runner-dejavu/$f.ttf" /usr/share/fonts/truetype/dejavu/; done
            fc-cache -f >/dev/null 2>&1 || true
            echo "DejaVu copied from the runner"
          else
            apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-dejavu-core
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Saved-game format and room protocol numbers never go down (README "Rolling back").
      - name: Versions never go down
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          node scripts/check-versions.ts --run FETCH_HEAD
      - run: npm run check
      - run: npm run lint
      - run: npm run test:unit -- --run
      - run: npm run check:parity
      - run: npm run build

  e2e:
    name: E2E · ${{ matrix.label }}
    runs-on: ubuntu-latest
    # Playwright's own image has Chromium and its system libraries installed, so no job spends
    # time on `playwright install --with-deps` (which took 10 minutes on about one run in ten).
    # The tag must match the installed @playwright/test; scripts/scripts.test.ts checks it.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # The runner's own DejaVu, read-only, so the font needs no download (see Prepare container).
      options: --ipc=host -v /usr/share/fonts/truetype/dejavu:/opt/runner-dejavu:ro
    # One job per area of e2e/areas.ts (a slow area over several), so a red check names what
    # broke. Every job runs on every PR and push: features import each other, so a change in one
    # can break another's tests. Eight numbered shards took 12 to 31 minutes on 2026-11-19; the
    # areas are sized to about 20 each. scripts/e2e-areas.test.ts checks this list against
    # e2e/areas.ts. Branch rules require "E2E done", not these jobs, so the list can change.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { area: board, part: 1, of: 3, label: Grimoire board 1 of 3 }
          - { area: board, part: 2, of: 3, label: Grimoire board 2 of 3 }
          - { area: board, part: 3, of: 3, label: Grimoire board 3 of 3 }
          - { area: rules, part: 1, of: 2, label: 'Characters, rules and setup 1 of 2' }
          - { area: rules, part: 2, of: 2, label: 'Characters, rules and setup 2 of 2' }
          - { area: rooms, part: 1, of: 2, label: Rooms and players 1 of 2 }
          - { area: rooms, part: 2, of: 2, label: Rooms and players 2 of 2 }
          - { area: day, part: 1, of: 1, label: Day and game flow }
          - { area: app, part: 1, of: 1, label: 'App, settings and theme' }
          - { area: scripts, part: 1, of: 1, label: Scripts and builders }
    steps:
      - uses: actions/checkout@v6
      # The container runs as root over a checkout owned by the runner user, so git refuses
      # the repo without safe.directory and the changelog and update notes come out empty.
      # DejaVu is the runner's monospace font; the image lacks it, and its fallback monospace
      # has narrower letters that change wrapping in the layout tests. The core set (what
      # fonts-dejavu-core installs) is copied from the runner, because the Ubuntu mirrors stopped
      # resolving from the container for over an hour on 2026-11-11; apt is the fallback.
      - name: Prepare container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          core="DejaVuSans DejaVuSans-Bold DejaVuSansMono DejaVuSansMono-Bold DejaVuSerif DejaVuSerif-Bold"
          have=yes
          for f in $core; do [ -f "/opt/runner-dejavu/$f.ttf" ] || have=no; done
          if [ "$have" = yes ]; then
            mkdir -p /usr/share/fonts/truetype/dejavu
            for f in $core; do cp "/opt/runner-dejavu/$f.ttf" /usr/share/fonts/truetype/dejavu/; done
            fc-cache -f >/dev/null 2>&1 || true
            echo "DejaVu copied from the runner"
          else
            apt-get update -qq && apt-get install -y -qq --no-install-recommends fonts-dejavu-core
          fi
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/e2e-area.ts --run ${{ matrix.area }} ${{ matrix.part }}/${{ matrix.of }}
      - name: List flaky tests
        id: flaky
        if: always()
        run: node scripts/flaky-summary.ts --run
      # A flaky test passes on its retry, so the job is green; the report still holds the failed
      # attempt's trace, which is the only way to see why it flaked.
      - if: failure() || fromJSON(steps.flaky.outputs.flaky || '0') > 0
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.area }}-${{ matrix.part }}
          path: playwright-report
          retention-days: 7

  # The one e2e check the branch rules require, so adding or removing area jobs needs no ruleset
  # change. It fails unless every area job passed (a skipped or cancelled job fails it too).
  e2e-done:
    name: E2E done
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.e2e.result != 'success'
        run: |
          echo "E2E area jobs finished with: ${{ needs.e2e.result }}"
          exit 1
      - run: echo "Every e2e area passed."
