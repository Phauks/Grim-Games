<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover: the page draws under the phone's status and navigation bars, and
		     the header, footer and full-screen views pad by env(safe-area-inset-*). -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
		/>
		<meta name="text-scale" content="scale" />
		<!-- The default theme's --surface; applyAppearance (ui/themes/apply.ts) follows the theme. -->
		<meta name="theme-color" content="#140b0b" />
		<!-- The same colour behind the page until the app has loaded, instead of white. -->
		<style>
			html {
				background: #140b0b;
				color-scheme: dark;
			}
		</style>
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icons/apple-touch-icon.png" />
		<!--
			Boot-failure screen (static/boot-failure.js): shows a build that can't start its error
			instead of a blank page. A file rather than inline, for the Content Security Policy.
		-->
		<script src="%sveltekit.assets%/boot-failure.js" data-build="%sveltekit.version%"></script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="app-root" style="display: contents">%sveltekit.body%</div>
	</body>
</html>
